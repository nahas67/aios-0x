version: "3.9"

services:
  aios:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - aios-data:/app/data
      - ./data/golden:/app/data/golden:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: Qdrant vector DB (uncomment when scaling beyond local mode)
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant-data:/qdrant/storage

  # Optional: NATS for durable messaging (uncomment for multi-process deployment)
  # nats:
  #   image: nats:2-alpine
  #   ports:
  #     - "4222:4222"
  #   command: ["--jetstream", "--store_dir", "/data"]
  #   volumes:
  #     - nats-data:/data

volumes:
  aios-data:
