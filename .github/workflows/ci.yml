name: AIOS-0X CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Dependency model + Python backend (hermetic: SQLite only) ────────────
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # There is no requirements.txt: pyproject.toml is the ONE dependency
      # model, and requirements.lock is generated from it.
      - name: Install (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check
      # The gate compares requirements.lock against pyproject.toml and needs no
      # installed packages, so it gives the same verdict on every runner. It
      # previously primed the environment with unpinned ranges and compared against
      # a closure recomputed from it -- which meant the gate passed only on the
      # machine that generated the lock and broke whenever anything in the closure
      # was released.
      - name: Lock file is current
        run: python scripts/lock_dependencies.py --check
      - name: Lint (ruff)
        run: ruff check .
      # Architecture boundary, anti-pattern, goal-registry, and authority-chain
      # checks run as tests in the suite below. The lint is separate because it
      # is a build gate, not a test of behaviour.
      - name: Anti-pattern lint (build gate)
        run: python scripts/anti_pattern_lint.py
      # W0: mypy previously covered only 80 of 123 project files, so the wider
      # sweep was manual and could regress silently (CHECKPOINT.md). Widen it to
      # every first-party package.
      - name: Types (mypy, all first-party packages)
        run: >-
          mypy --python-version 3.12 --follow-imports=silent
          core api communities schemas kernel simulation aios research
      - name: Tests (SQLite + in-memory bus)
        run: PYTHONPATH=. pytest --disable-warnings -q -m "not integration" --timeout=120

  # ── PostgreSQL integration: real concurrency, not mocked ─────────────────
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (postgres extras)
        run: pip install -e ".[dev,postgres]"
      - name: Migrate the financial schema
        env:
          AIOS_TEST_PG_DSN: "postgresql://aios:test@localhost:5432/aios_test"
        run: python -m aios db migrate --dsn "$AIOS_TEST_PG_DSN"
      - name: PostgreSQL parity + concurrency tests
        env:
          AIOS_TEST_PG_DSN: "postgresql://aios:test@localhost:5432/aios_test"
        run: |
          PYTHONPATH=. pytest --disable-warnings -q --timeout=180 \
            tests/test_v1a2_postgres.py tests/test_v1a2_concurrency.py \
            tests/test_phase_b_postgres.py

  # ── JetStream integration: durable consumers, redelivery, DLQ ────────────
  jetstream:
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8222/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --entrypoint nats-server
          --jetstream --http_port 8222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (nats extras)
        run: pip install -e ".[dev,nats]"
      - name: JetStream integration tests
        env:
          AIOS_TEST_NATS_URL: "nats://127.0.0.1:4222"
        run: PYTHONPATH=. pytest --disable-warnings -q --timeout=180 tests/test_v1a2_jetstream.py

  # ── Frontend ────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: cd frontend && npx tsc -b --noEmit
      - name: Production build
        run: cd frontend && npx vite build
      - name: Verify build output
        run: test -f ui/dist/index.html

  # ── Security scan ───────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets in source
        # The key pattern requires a provider prefix and a long base62 body.
        # The previous "sk-[a-zA-Z0-9]" matched any word ending in "risk-"
        # ("risk-bot", "risk-governor") or "task-tier", so the gate failed on
        # ordinary source and had to be read past rather than obeyed. A gate
        # that cries wolf on a hundred false hits is a gate nobody runs.
        # Real OpenAI keys are sk- plus 48 chars (or sk-proj- plus longer);
        # Anthropic's carry sk-ant-. 32 chars is below every real key and above
        # every English word that ends in "sk-". tests/test_supply_chain.py
        # pins both halves of this claim: it must miss the decoys and catch
        # realistic key shapes, so the pattern cannot silently rot again.
        run: |
          if grep -rEn "sk-(proj-|ant-)?[A-Za-z0-9_-]{32,}" --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" .; then
            echo "ERROR: API key pattern found in source"
            exit 1
          fi
          if grep -rn "figd_[A-Za-z0-9]" --include="*.md" --include="*.json" --include="*.ts" .; then
            echo "ERROR: Figma token found in distributable files"
            exit 1
          fi
          echo "No secrets found in source"
      - name: Verify .env is excluded
        run: |
          if git ls-files .env | grep -q .env; then
            echo "ERROR: .env is tracked by git"
            exit 1
          fi
          echo ".env is properly excluded"
      # Strong copyleft is inadmissible as a runtime dependency (docs/LICENSES.md).
      # Checked at the license level rather than the package name so a future
      # dependency cannot slip in under a different name.
      - name: Reject strong-copyleft and unlicensed dependencies
        run: |
          python - <<'PY'
          import sys, tomllib, pathlib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          runtime = set()
          for group in ("dependencies", *(f"optional-dependencies.{k}" for k in data.get("optional-dependencies", {}))):
              node = data.get("project", {})
              if group == "dependencies":
                  runtime.update(node.get("dependencies", []))
              else:
                  runtime.update(data["project"]["optional-dependencies"][group.split(".", 1)[1]])
          banned = ("agpl", "gpl-3", "gpl3")
          offenders = [d for d in sorted(runtime) if any(b in d.lower() for b in banned)]
          if offenders:
              print("ERROR: strong copyleft admitted as a dependency:", offenders)
              sys.exit(1)
          print(f"{len(runtime)} declared dependencies, none strong copyleft")
          PY

  # ── Docker build ────────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t aios-0x:test .
      - name: Smoke test container
        run: |
          docker run -d --name aios-test -p 8787:8787 aios-0x:test
          sleep 5
          curl -sf http://127.0.0.1:8787/api/v1/health || exit 1
          curl -sf http://127.0.0.1:8787/ | head -1 | grep -q "doctype" || exit 1
          docker stop aios-test
