<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIOS-0X · Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS (ADR-004 · Dark OLED institutional) ============ */
:root{
  --bg:#020617;--panel:#0e1223;--panel2:#151b2e;--muted:#1a1e2f;
  --line:#334155;--line-soft:#1e2740;
  --text:#f8fafc;--dim:#94a3b8;--faint:#5b6b82;
  --ok:#22c55e;--warn:#eab308;--bad:#ef4444;--accent:#38bdf8;
  --mono:"Fira Code",Consolas,monospace;--sans:"Fira Sans","Segoe UI",system-ui,sans-serif;
  --r:8px;--sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#243147;border-radius:5px}

/* ============ shell ============ */
header{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:30}
.logo{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.1em;color:var(--accent);margin-right:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;background:var(--muted);border:1px solid var(--line-soft);color:var(--dim);white-space:nowrap}
.pill.ok{color:#4ade80;border-color:rgba(74,222,128,.35)}
.pill.warn{color:var(--warn);border-color:rgba(234,179,8,.35)}
.pill.bad{color:#f87171;border-color:rgba(239,68,68,.4)}
.spacer{flex:1}
#search{width:230px;background:var(--panel2);border:1px solid var(--line-soft);color:var(--text);border-radius:8px;padding:6px 11px;font-size:12.5px}
#search::placeholder{color:var(--faint)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;transition:border-color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger:hover{border-color:var(--bad);color:#f87171}
.btn.primary{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.4);color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:11.5px}
select.btn{appearance:none;padding-right:22px}
label.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim);cursor:pointer;white-space:nowrap}

nav{position:fixed;top:52px;bottom:0;left:0;width:186px;padding:10px 8px 20px;border-right:1px solid var(--line-soft);background:var(--panel);overflow-y:auto}
.navgroup{font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;padding:14px 12px 5px;font-weight:600}
.navgroup:first-child{padding-top:4px}
nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:var(--dim);padding:7px 12px;font-size:13px;cursor:pointer;border-radius:7px}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.active{background:var(--panel2);color:var(--accent);font-weight:600}
nav button .nbadge{margin-left:auto;font-size:10px;background:rgba(234,179,8,.15);color:var(--warn);padding:1px 6px;border-radius:8px}
main{margin-left:186px;padding:18px 22px 60px;max-width:1360px}
h2.sec{font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin:22px 0 10px;font-weight:600}
h2.sec:first-child{margin-top:0}
section{display:none}section.active{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ components ============ */
.grid{display:grid;gap:10px}
.cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:11px 13px}
.card b{display:block;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;font-weight:600}
.card .v{font-size:19px;font-weight:650;font-family:var(--mono)}
.card .s{font-size:11px;color:var(--faint);margin-top:2px}
.pos{color:#4ade80}.neg{color:#f87171}.warnT{color:var(--warn)}

table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
th,td{padding:8px 13px;border-bottom:1px solid var(--line-soft);text-align:left;font-size:12.5px}
th{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#121a2b}
tr.rowlink{cursor:pointer}
.empty{padding:18px;text-align:center;color:var(--faint);font-size:12.5px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}

.badge{display:inline-block;padding:2px 8px;border-radius:9px;font-size:10.5px;font-weight:600;letter-spacing:.03em}
.b-buy{background:rgba(34,197,94,.13);color:#4ade80}
.b-sell{background:rgba(239,68,68,.14);color:#f87171}
.b-ok{background:rgba(34,197,94,.13);color:#4ade80}
.b-warn{background:rgba(234,179,8,.13);color:var(--warn)}
.b-bad{background:rgba(239,68,68,.15);color:#f87171}
.b-dim{background:var(--muted);color:var(--dim)}
.b-acc{background:rgba(56,189,248,.13);color:var(--accent)}

.bar{height:4px;background:#1a2432;border-radius:3px;overflow:hidden;margin-top:4px;min-width:70px}
.bar i{display:block;height:100%;background:var(--ok)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px dashed #17202d;font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--dim)}
pre.raw{background:#070b14;border:1px solid var(--line-soft);border-radius:8px;padding:12px;font-family:var(--mono);font-size:11.5px;color:#8fa3ba;white-space:pre-wrap;word-break:break-word;max-height:400px;overflow:auto}
.hidden{display:none!important}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line-soft);border-radius:999px;padding:4px 11px;font-size:11.5px;color:var(--dim);margin-right:6px}
.chip b{color:var(--text);font-weight:600}

/* drawer (decision workspace) */
#drawer-back{position:fixed;inset:0;background:rgba(1,4,10,.7);z-index:40;display:none}
#drawer{position:fixed;top:0;right:-640px;bottom:0;width:min(660px,94vw);background:var(--panel);border-left:1px solid var(--line);z-index:41;transition:right .22s ease-out;display:flex;flex-direction:column}
#drawer.open{right:0}
#drawer .dhead{padding:16px 20px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
#drawer .dbody{padding:16px 20px 30px;overflow-y:auto;flex:1}
.x{cursor:pointer;color:var(--dim);font-size:19px;background:none;border:none;line-height:1}
.x:hover{color:var(--text)}

/* modal (confirm / raw) */
#modal-back{position:fixed;inset:0;background:rgba(1,4,10,.72);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(560px,94vw);padding:20px 22px;max-height:86vh;overflow:auto}

/* settings */
.acc{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--panel);margin-bottom:9px;overflow:hidden}
.acc>.head{padding:11px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}
.acc>.head small{color:var(--faint);font-weight:400;margin-left:9px}
.acc>.body{padding:4px 15px 13px;border-top:1px solid var(--line-soft)}
.expert-only{display:none}.expert .expert-only{display:block}.expert tr.expert-only{display:table-row}
label.chk input{accent-color:var(--accent)}

@media(max-width:960px){nav{display:none}main{margin-left:0}}
</style>
</head>
<body>

<header>
  <span class="logo">AIOS-0X</span>
  <span id="p-state" class="pill">STATE —</span>
  <span id="p-dd" class="pill">DD —</span>
  <span id="p-chain" class="pill">CHAIN —</span>
  <span id="p-nav" class="pill">NAV —</span>
  <span id="p-sse" class="pill">SSE —</span>
  <div class="spacer"></div>
  <div style="position:relative">
  <input id="search" autocomplete="off" style="width:230px;background:var(--panel2);border:1px solid var(--line-soft);color:var(--text);border-radius:8px;padding:6px 11px;font-size:12.5px" placeholder="Search  ( / )" aria-label="Global search">
  <div id="search-dd" class="hidden" style="position:absolute;top:110%;right:0;width:340px;max-height:420px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.5)"></div>
</div>
  <label class="chk" title="Expert mode: show advanced + raw"><input type="checkbox" id="expert"> Expert</label>
  <select id="autonomy" class="btn" aria-label="Autonomy mode">
    <option>MANUAL</option><option>ASSISTED</option><option>SUPERVISED</option>
    <option selected>AUTONOMOUS</option><option>EMERGENCY</option>
  </select>
  <button class="btn danger" id="killbtn" aria-label="Emergency kill switch">⏹ KILL</button>
</header>

<nav id="nav" aria-label="Main navigation"></nav>
<main id="main"></main>

<div id="drawer-back" onclick="closeDrawer()"></div>
<div id="drawer" role="dialog" aria-modal="true">
  <div class="dhead"><h3 id="d-title" style="font-size:15px">Workspace</h3><button class="x" onclick="closeDrawer()" aria-label="Close">✕</button></div>
  <div class="dbody" id="d-body"></div>
</div>

<div id="modal-back"><div id="modal"></div></div>

<script>
/* ================================================================ utils */
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const fmt=v=>v==null?"—":v;
const money=v=>v==null?"—":(v<0?`−$${Math.abs(Number(v)).toFixed(2)}`:`$${Number(v).toFixed(2)}`);
const cls=v=>v>0?"pos":v<0?"neg":"";
const badge=(t,c="b-dim")=>`<span class="badge ${c}">${esc(t)}</span>`;
async function j(u,o){const r=await fetch(u,o);const b=await r.json();if(!r.ok)throw new Error(b.error||r.status);return b}
const SYNC={};
function pill(id,text,c){$(id).textContent=text;$(id).className="pill "+(c||"")}
function toggle(id){$(id).classList.toggle("hidden")}

/* ================================================================ nav */
const NAV={
  "COMMAND":[["cmd","Command Center"],["opps","Opportunities"],["decisions","Decisions"],["pnl","P&L Analysis"],["portfolio","Portfolio"],["positions","Positions"],["execution","Execution"],["risk","Risk"],["chat","Operator Console"]],
  "INTELLIGENCE":[["agents","Agent Network"],["events","Global Events"],["memory","Memory & Research"],["strategies","Strategy Center"]],
  "RESEARCH":[["knowledge","Hypothesis Graph"],["platform","Platform Events"],["models","Model Registry"]],
 "OPERATIONS":[["accounting","Accounting"],["tax","Tax & CA"],["ca","CA Review"],["audit","Audit"]],
 "SYSTEM":[["alerts","Alerts"],["health","System Health"],["settings","Settings"]],
};
let current="cmd";
const nav=$("nav");
for(const [group,items] of Object.entries(NAV)){
  const g=document.createElement("div");g.className="navgroup";g.textContent=group;nav.appendChild(g);
  for(const [t,label] of items){
    const b=document.createElement("button");b.textContent=label;b.dataset.t=t;b.id="nav-"+t;
    b.onclick=()=>showTab(t);nav.appendChild(b);
  }
}
function showTab(t){current=t;
 document.querySelectorAll("main>section").forEach(s=>s.classList.toggle("active",s.dataset.t===t));
 nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.t===t));
 refresh(true);}
const MAIN=$("main");
for(const t of Object.keys(NAV).flatMap(g=>NAV[g].map(i=>i[0]))){
  const s=document.createElement("section");s.dataset.t=t;MAIN.appendChild(s);
}

/* ================================================================ charts */
function drawChart(canvas,series,dd,color){
 const ctx=canvas.getContext("2d");const w=canvas.width=canvas.offsetWidth*2;const h=canvas.height=canvas.offsetHeight*2;
 ctx.clearRect(0,0,w,h);
 if(!series||series.length<2){ctx.fillStyle="#5b6b82";ctx.font="24px Fira Sans";ctx.fillText("Not enough data",w/2-90,h/2);return;}
 const min=Math.min(...series),max=Math.max(...series);const range=(max-min)||1;
 const pad=34;const iw=w-pad*2,ih=h-pad*1.7;
 const xy=i=>[pad+i/(series.length-1)*iw, pad+(1-(series[i]-min)/range)*ih];
 ctx.strokeStyle="#1e2740";ctx.lineWidth=1;
 for(let g=0;g<=4;g++){const y=pad+g/4*ih;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();
  ctx.fillStyle="#5b6b82";ctx.font="19px Fira Code";ctx.fillText((max-g/4*range).toFixed(0),2,y+6);}
 ctx.beginPath();ctx.moveTo(...xy(0));
 for(let i=1;i<series.length;i++)ctx.lineTo(...xy(i));
 ctx.lineTo(w-pad,h-pad*0.85);ctx.lineTo(pad,h-pad*0.85);ctx.closePath();
 ctx.fillStyle="rgba(56,189,248,0.06)";ctx.fill();
 ctx.beginPath();ctx.moveTo(...xy(0));
 for(let i=1;i<series.length;i++)ctx.lineTo(...xy(i));
 ctx.strokeStyle=color||"#38bdf8";ctx.lineWidth=3;ctx.stroke();
 const [lx,ly]=xy(series.length-1);
 ctx.beginPath();ctx.arc(lx,ly,6,0,Math.PI*2);ctx.fillStyle=color||"#38bdf8";ctx.fill();
 if(dd&&dd.length===series.length){
  const dmax=Math.max(...dd,0.01);
  ctx.beginPath();
  for(let i=0;i<dd.length;i++){const x=pad+i/(dd.length-1)*iw;const y=pad+(1-dd[i]/dmax)*ih*0.5;ctx.lineTo(x,y);}
  ctx.strokeStyle="rgba(239,68,68,0.55)";ctx.lineWidth=2;ctx.stroke();
 }
}

/* ================================================================ command center */
SECTIONS={};
SECTIONS.cmd=`
 <h2 class="sec">Performance</h2>
 <div id="chart-holder" class="card" style="padding:8px"><canvas style="width:100%;height:200px"></canvas></div>
 <h2 class="sec">Portfolio</h2>
 <div class="grid cards" id="c-cards"></div>
 <h2 class="sec">Market Regime</h2>
 <div id="c-regimes" style="margin-bottom:4px"></div>
 <h2 class="sec">AI Market View</h2>
 <div id="c-ai"></div>
 <h2 class="sec">Top Opportunities</h2>
 <div id="c-opps"></div>
 <h2 class="sec">Recent Decisions</h2>
 <div id="c-decisions"></div>
 <h2 class="sec">Event Feed</h2>
 <div id="c-events"></div>`;

async function loadCmd(){
 const [ex,pf,reg,opps,evts,decs,eq]=await Promise.all([
  j("/api/v1/executive"),j("/api/v1/portfolio"),j("/api/v1/regimes"),
  j("/api/v1/opportunities"),j("/api/v1/events"),j("/api/v1/executions"),j("/api/v1/equity")]);
 SYNC.equity=eq;
 pill("p-state","STATE "+(ex.emergency_state||"—"),ex.emergency_state==="NORMAL"?"ok":"bad");
 const dd=ex.drawdown_pct??0;
 pill("p-dd",`DD ${dd}%`,dd>=2.5?"bad":dd>=1.5?"warn":"ok");
 pill("p-chain","CHAIN "+(ex.chain_valid?"OK":"BROKEN"),ex.chain_valid?"ok":"bad");
 pill("p-nav","NAV "+money(pf.nav));
 $("c-cards").innerHTML=[
  ["Portfolio NAV",money(pf.nav),""],["Cash",money(pf.cash),""],
  ["Realized P&L",money(pf.realized_pnl),cls(pf.realized_pnl)],
  ["Exposure",fmt(pf.exposure_pct)+"%",pf.exposure_pct>60?"warnT":""],
  ["Open Positions",fmt(pf.open_notional!=null?(await j("/api/v1/positions")).positions.length:"—"),""],
  ["Drawdown",`${fmt(dd)}%`,dd>=1.5?"warnT":""],
  ["Closed Trades",fmt(pf.closed_trades),""],
  ["Events Audited",fmt(ex.events_logged),""],
 ].map(([k,v,c])=>`<div class="card"><b>${k}</b><span class="v ${c}">${fmt(v)}</span></div>`).join("");

 // clickable card routing (Directive §5)
 const routes={"Drawdown":"risk","Realized P&L":"pnl","Open Positions":"positions","Portfolio NAV":"portfolio"};
 $("c-cards").querySelectorAll(".card").forEach((el,i)=>{
  const label=el.querySelector("b").textContent;
  if(routes[label]){el.style.cursor="pointer";el.onclick=()=>showTab(routes[label]);}
 });

 requestAnimationFrame(()=>{const cv=$("chart-holder")?.querySelector("canvas");if(cv)drawChart(cv,eq.equity||[],eq.drawdown_pct||[]);});

 $("c-regimes").innerHTML=(reg.regimes||[]).map(r=>{
   const tone=r.trend==="UP"?"b-ok":r.trend==="DOWN"?"b-bad":"b-dim";
   const vol=r.vol_regime==="HIGH"?badge("HIGH VOL","b-warn"):r.vol_regime==="LOW"?badge("LOW VOL","b-dim"):badge("NORMAL VOL","b-dim");
   return `<span class="chip"><b>${esc(r.symbol)}</b> ${badge(r.trend,tone)} ${vol} <span style="color:var(--faint)">σ ${r.realized_vol_pct}%</span></span>`;
 }).join("")||`<span class="empty" style="display:block">No regime data yet — needs ≥5 bars.</span>`;

 const last=(decs.executions||[])[0];
 $("c-ai").innerHTML=last?`<div class="card">
   <div class="kv"><span class="k">Latest AI decision</span><span>${badge(last.symbol,"b-acc")} ${badge(last.action,last.action==="SELL"?"b-sell":"b-buy")} ${last.confidence_pct!=null?badge("conf "+last.confidence_pct+"%",last.confidence_pct>=70?"b-ok":"b-warn"):""}</span></div>
   <div class="kv"><span class="k">Outcome so far</span><span class="${cls(last.realized_pnl)}">${money(last.realized_pnl)} <small style="color:var(--faint)">${fmt(last.exit_reason)}</small></span></div>
   <div style="margin-top:9px"><button class="btn sm" onclick="openDecision('${last.execution_id}')">Why? — open decision workspace →</button></div></div>`
  :`<div class="empty">No AI decisions yet.</div>`;

 const o=(opps.opportunities||[]).slice(0,5);
 $("c-opps").innerHTML=o.length?`<table><thead><tr><th>Symbol</th><th>Family</th><th>Edge</th><th>R:R</th><th>Decay</th><th>Rank</th></tr></thead><tbody>${
  o.map(x=>`<tr><td><b>${esc(x.symbol)}</b></td><td>${badge(x.family,"b-acc")}</td>
   <td class="${cls(x.edge_proxy)}">${fmt(x.edge_proxy)}</td><td>${fmt(x.expected_rr)}</td>
   <td>${fmt(x.alpha_decay)}</td><td><b>${fmt(x.composite_rank)}</b></td></tr>`).join("")}</tbody></table>`
  :`<div class="empty">No ranked opportunities in the current window.</div>`;

 $("c-decisions").innerHTML=decTable((decs.executions||[]).slice(0,8));
 const ev=(evts.events||[]).slice(0,6);
 $("c-events").innerHTML=ev.length?ev.map(e=>`<div class="kv"><span>${badge(e.label,"b-acc")} ${esc(String(e.title)).slice(0,90)}</span><span style="color:var(--faint);font-size:11px">${esc(String(e.ts)).slice(11,19)}</span></div>`).join("")
  :`<div class="empty">Quiet — no world/risk events.</div>`;
}
function decTable(rows){
 return rows.length?`<table><thead><tr><th>Symbol</th><th>Action</th><th>Verification</th><th>Confidence</th><th>Outcome</th></tr></thead><tbody>${
  rows.map(e=>`<tr class="rowlink" onclick="openDecision('${e.execution_id}')">
   <td><b>${esc(e.symbol)}</b></td>
   <td>${badge(e.action||"?",e.action==="SELL"?"b-sell":"b-buy")}</td>
   <td>${badge("VERIFIED ✓","b-ok")}</td>
   <td><div style="min-width:84px">${e.confidence_pct!=null?e.confidence_pct+"%":"100%"}<div class="bar"><i style="width:${e.confidence_pct||100}%"></i></div></div></td>
   <td class="${cls(e.realized_pnl)}">${money(e.realized_pnl)}<br><small style="color:var(--faint)">${fmt(e.exit_reason)}</small></td></tr>`).join("")}</tbody></table>`
  :`<div class="empty">No closed decisions yet.</div>`;
}

/* ---------------- opportunities ---------------- */
SECTIONS.opps=`<h2 class="sec">Opportunity Ranking <small style="color:var(--faint);text-transform:none;letter-spacing:0">edge × R:R × alpha-decay — confidence is NOT a profit guarantee</small></h2><div id="o-body"></div>`;
async function loadOpps(){const d=await j("/api/v1/opportunities");
 $("o-body").innerHTML=(d.opportunities||[]).length?`<table><thead><tr><th>Symbol</th><th>Family</th><th>Edge proxy</th><th>Expected R:R</th><th>α-decay</th><th>Composite</th></tr></thead><tbody>${
  d.opportunities.map(x=>`<tr><td><b>${esc(x.symbol)}</b></td><td>${badge(x.family,"b-acc")}</td><td class="${cls(x.edge_proxy)}">${fmt(x.edge_proxy)}</td><td>${fmt(x.expected_rr)}</td><td>${fmt(x.alpha_decay)}</td><td><b>${fmt(x.composite_rank)}</b></td></tr>`).join("")}</tbody></table>`
 :`<div class="empty">No opportunities ranked yet.</div>`;}

/* ---------------- decisions ---------------- */
SECTIONS.decisions=`<h2 class="sec">Decision History</h2><div id="d-body"></div>`;
async function loadDecisions(){const d=await j("/api/v1/executions");
 $("d-body").innerHTML=decTable(d.executions||[]);}

async function openDecision(id){
 const d=await j("/api/v1/decisions/"+id);
 const v=d.verification,o=d.outcome,s=d.decision,r=d.reason,ev=d.evidence,rk=d.risk;
 const conf=v.confidence_score??0;

SECTIONS.chat=`<h2 class="sec">Operator Console <small style="color:var(--faint);text-transform:none">ask anything (read-only) · commands run through RBAC with your role — the bot holds no authority</small></h2>
<div class="grid" style="grid-template-columns:1fr 260px">
 <div><div id="chat-log" class="card" style="min-height:300px;max-height:460px;overflow:auto;white-space:pre-wrap;font-size:12.5px"></div>
 <div style="display:flex;gap:8px;margin-top:8px">
  <input id="chat-in" style="flex:1;background:var(--panel2);border:1px solid var(--line-soft);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px" placeholder='e.g. "pnl" · "gates" · "pause trading" · "promote model direction_logreg"' aria-label="Chat message">
  <select id="chat-role" class="btn"><option>OPERATOR</option><option>VIEWER</option><option>RISK_ADMIN</option><option>ADMIN</option></select>
  <button class="btn" onclick="sendChat()">send</button></div></div>
 <div class="card"><b>Try</b><div style="font-size:12px;color:var(--dim);margin-top:6px;line-height:1.7">pnl<br>gates<br>hypotheses<br>models<br>evaluations<br>risk<br>platform events<br><span style="color:var(--warn)">pause trading</span><br><span style="color:var(--warn)">set autonomy supervised</span><br><span style="color:var(--warn)">approve live capital</span></div></div></div>`;
async function sendChat(){
 const inp=$("chat-in");const msg=inp.value.trim();if(!msg)return;
 const role=$("chat-role").value;
 chatAppend("you ["+role+"]",msg);
 inp.value="";
 try{
  const r=await fetch("/api/v1/chat",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({operator_id:"console-user",role,message:msg})});
  const d=await r.json();
  const cls=d.kind==="denied"?"b-bad":d.kind==="command"?"b-warn":"b-ok";
  let text=d.answer||JSON.stringify(d);
  if(d.kind==="query"&&d.data){try{text+="\n"+JSON.stringify(d.data).slice(0,600);}catch(e){}}
  chatAppend("aios",text,cls);
 }catch(e){chatAppend("aios","request failed: "+e,"b-bad");}}
function chatAppend(who,text,badgeCls){
 const log=$("chat-log");
 log.innerHTML+=`<div style="margin-bottom:10px">${badge(who,badgeCls||"b-acc")}<div style="margin-top:3px">${esc(String(text))}</div></div>`;
 log.scrollTop=log.scrollHeight;}

SECTIONS.settings=`<h2 class="sec">Settings Center</h2>
 <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
  <input id="set-q" class="btn" style="width:260px" placeholder="Filter settings…" oninput="filterSettings(this.value)" aria-label="Search settings">

 </div>

const PRESETS={
 CONSERVATIVE:{max_class_exposure_pct:20,halt_dd_pct:2.0,research_mode:"deterministic",
  warn:"Tightest capital protection; LLM research disabled (deterministic mode)."},
 BALANCED:{max_class_exposure_pct:35,halt_dd_pct:3.0,research_mode:"auto",
  warn:"Matches ratified CONSTITUTION v1.0.0 defaults."},
 AGGRESSIVE:{max_class_exposure_pct:50,halt_dd_pct:4.0,research_mode:"auto",
  warn:"Widens permitted loss bounds beyond ratified constitution defaults — requires explicit risk acceptance."},
};
async function loadSettings(){const d=await j("/api/v1/settings");
 SYNC.settings=d;
 const groups=[
  ["SYSTEM","system",[["Model provider","model_provider"],["Research mode","research_mode","research"],["LLM configured","llm_configured_bool"],["Shadow mode","shadow_bool"]]],
  ["AI & AGENTS","ai",[["Cheap model","research_model_cheap"],["Reasoning model","research_model_reasoning"],["Verifier","verification_model"],["Temperature","llm_temperature"]]],
  ["DATA PROVIDERS","data",[["Finnhub","finnhub_bool"],["GNews","gnews_bool"],["NewsData","newsdata_bool"],["MarketStack","marketstack_bool"],["FRED","fred_bool"]]],
  ["RISK LIMITS","risk",[["Max class exposure %","max_class_exposure_pct","limit"],["Halt drawdown %","halt_dd_pct","limit"],["Caution drawdown %","caution_dd_pct"],["Warning drawdown %","warning_dd_pct"]]],
  ["EXECUTION RAILS","execution_rails",[["Live execution (env)","live_execution_allowed_env_bool"],["Micro-live cap $","micro_live_cap_usd"],["Constitution pinned","constitution_pinned_bool"]]],
 ];
 const bools=new Set(["llm_configured_bool","shadow_bool","finnhub_bool","gnews_bool","newsdata_bool","marketstack_bool","fred_bool","live_execution_allowed_env_bool","constitution_pinned_bool"]);
 $("s-root").innerHTML=groups.map(([title,key,rows])=>`
  <div class="acc" data-group="${key}"><div class="head" onclick="this.nextElementSibling.classList.toggle('hidden')">${title}<small>effective values</small></div><div class="body">
  ${rows.map(([label,k,edit])=>{
    let v=d[key]?.[k];
    let control="";
    if(edit==="research")control=`<select class="btn" onchange="setResearch(this.value)"><option value="auto"${v==="auto"?" selected":""}>auto</option><option value="deterministic"${v==="deterministic"?" selected":""}>deterministic</option></select>`;
    else if(edit==="limit")control=`<input class="btn" style="width:110px" value="${fmt(v)}" data-k="${k}" onchange="confirmLimit(this.dataset.k,this.value)">`;
    if(bools.has(k))v=typeof v==="boolean"&&v||v==="1"?badge("CONFIGURED","b-ok"):badge("OFF","b-dim");
    return `<div class="kv setrow" data-label="${label.toLowerCase()}"><span class="k">${label}</span><span>${control||fmt(v)}</span></div>`;
  }).join("")}
  </div></div>`).join("")
  +`<div class="acc"><div class="head" onclick="this.nextElementSibling.classList.toggle('hidden')">RAW CONFIGURATION<small>/api/v1/settings</small></div><div class="body hidden"><pre class="raw">${esc(JSON.stringify(d,null,2))}</pre></div></div>`;

function filterSettings(q){
 q=(q||"").toLowerCase();
 document.querySelectorAll("#s-root .setrow").forEach(row=>{
  row.style.display=row.dataset.label.includes(q)?"":"none";});

async function setResearch(m){await j("/api/v1/control/set_research_mode",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({operator_id:"console",role:"RISK_ADMIN",params:{mode:m}})});loadSettings();}
async function confirmLimit(k,v){
 const current=(SYNC.settings?.risk?.[k])??null;
 const nv=Number(v);
 if(isNaN(nv)||nv<=0){alert("Value must be a positive number");loadSettings();return;}
 if(current!=null&&Math.abs(nv-current)<1e-9)return; // no-op
 const labels={max_class_exposure_pct:"Max class exposure",halt_dd_pct:"Halt drawdown"};
 const riskNote=k==="halt_dd_pct"&&nv>3
  ?`<p style="color:#f87171;font-size:12.5px;margin:8px 0">⚠ This increases permitted portfolio loss beyond the ratified constitution default (3%).</p>`:"";
 $("modal").innerHTML=`<h3 style="margin-bottom:12px">Confirm configuration change</h3>
  <div class="kv"><span class="k">Setting</span><span>${labels[k]||k}</span></div>
  <div class="kv"><span class="k">Before</span><span>${fmt(current)}${k==="halt_dd_pct"||k==="max_class_exposure_pct"?"%":""}</span></div>
  <div class="kv"><span class="k">After</span><span class="warnT">${nv}${k==="halt_dd_pct"||k==="max_class_exposure_pct"?"%":""}</span></div>
  ${riskNote}
  <div class="kv"><span class="k">Audit</span><span style="color:var(--faint)">CONTROL_ACTION recorded (operator: console, RISK_ADMIN)</span></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
   <button class="btn" onclick="closeModal();loadSettings()">Cancel</button>
   <button class="btn primary" id="confirm-limit">Confirm change</button></div>`;
 $("modal-back").style.display="flex";
 $("confirm-limit").onclick=async()=>{
  const map={max_class_exposure_pct:"set_max_position_pct",halt_dd_pct:"set_halt_drawdown_pct"};
  const action=map[k];if(!action){closeModal();return;}
  await j("/api/v1/control/"+action,{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({operator_id:"console",role:"RISK_ADMIN",params:{pct:nv}})});
  closeModal();loadSettings();
 };
}
async function setLimit(k,v){confirmLimit(k,v);}
function applyPreset(name){
 const preset=PRESETS[name];if(!preset)return;
 const risk=SYNC.settings?.risk||{};
 const curMode=SYNC.settings?.system?.research_mode;
 const changes=[];
 const push=(label,before,after,action,params)=>{
  if(before==null||String(before)!==String(after))changes.push({label,before,after,action,params});};
 push("Max class exposure",risk.max_class_exposure_pct,preset.max_class_exposure_pct,
  "set_max_position_pct",{pct:preset.max_class_exposure_pct});
 push("Halt drawdown",risk.halt_dd_pct,preset.halt_dd_pct,
  "set_halt_drawdown_pct",{pct:preset.halt_dd_pct});
 push("Research mode",curMode,preset.research_mode,
  "set_research_mode",{mode:preset.research_mode});
 if(!changes.length){alert(`Preset ${name} matches current configuration — nothing to change.`);return;}
 $("modal").innerHTML=`<h3 style="margin-bottom:4px">Apply preset: ${name}</h3>
  <p style="color:var(--dim);font-size:12.5px;margin-bottom:10px">${esc(preset.warn)}</p>
  <table style="margin-bottom:12px"><thead><tr><th>Setting</th><th>Before</th><th>After</th></tr></thead><tbody>
  ${changes.map(c=>`<tr><td>${c.label}</td><td style="color:var(--dim)">${fmt(c.before)}</td><td class="warnT">${fmt(c.after)}</td></tr>`).join("")}
  </tbody></table>
  <p style="color:var(--faint);font-size:11.5px;margin-bottom:12px">All changes are recorded as audited CONTROL_ACTION events (operator: console, RISK_ADMIN).</p>
  <div style="display:flex;gap:8px;justify-content:flex-end">
   <button class="btn" onclick="closeModal()">Cancel</button>
   <button class="btn primary" id="confirm-preset">Apply ${changes.length} change${changes.length>1?"s":""}</button></div>`;
 $("modal-back").style.display="flex";
 $("confirm-preset").onclick=async()=>{
  closeModal();
  for(const c of changes){
   await j("/api/v1/control/"+c.action,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({operator_id:"console",role:"RISK_ADMIN",params:c.params})});
  }
  loadSettings();
 };
}

const SEARCH_GROUPS={
 "Workspaces":()=>Object.keys(NAV).flatMap(g=>NAV[g].map(i=>i[1]))
   .filter(n=>n.toLowerCase().includes($("search").value.toLowerCase()))
   .map(n=>({label:n,go:()=>{const entry=Object.entries(NAV).find(([,items])=>items.some(i=>i[1]===n));if(entry)showTab(entry[1].find(i=>i[1]===n)[0]);}})),
};
$("search").addEventListener("input",async e=>{
 const q=e.target.value.trim().toLowerCase();
 const dd=$("search-dd");
 if(!q){dd.classList.add("hidden");return;}
 // workspace matches (client-side)
 const ws=[];
 Object.values(NAV).flat().forEach(([t,label])=>{if(label.toLowerCase().includes(q))ws.push({label,tab:t});});
 // settings matches (client-side against last snapshot)
 const sets=[];
 Object.entries(SYNC.settings||{}).forEach(([group,rows])=>{
  if(typeof rows!=="object"||!rows)return;
  Object.entries(rows).forEach(([k,v])=>{
   if(k.toLowerCase().includes(q))sets.push({label:`${group}.${k}`,go:()=>showTab("settings")});
  });});
 // audit matches (server-side, debounced by Enter or 300ms)
 let audit=[];
 try{const d=await j(`/api/v1/audit?limit=6&q=${encodeURIComponent(q)}`);
  audit=(d.audit||[]).map(a=>({label:`${a.kind} ${a.ref_id||""}`.trim().slice(0,60),go:()=>showTab("audit")}));}catch(err){}
 const render=(title,items,color)=>items.length?`<div style="padding:4px 0"><div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;padding:4px 12px">${title}</div>${
  items.slice(0,5).map(x=>`<div style="padding:6px 12px;cursor:pointer" onmouseover="this.style.background='var(--panel2)'" onmouseout="this.style.background=''" onclick="$('search-dd').classList.add('hidden');(${x.go.toString()})()">${esc(x.label)}</div>`).join("")}</div>`:"";
 dd.innerHTML=render("Workspaces",ws)+render("Settings",sets)+render("Audit Records",audit)
  +`<div style="padding:8px 12px;border-top:1px solid var(--line-soft)"><button class="btn sm" onclick="$('search-dd').classList.add('hidden');showTab('audit');$('aud-q').value='${esc(q)}';loadAudit()">Full audit search →</button></div>`;
 dd.classList.remove("hidden");
});
$("search").addEventListener("keydown",e=>{
 if(e.key==="Enter"){const dd=$("search-dd");dd.classList.add("hidden");showTab("audit");$("aud-q").value=e.target.value;loadAudit();}
 if(e.key==="Escape"){$("search-dd").classList.add("hidden");e.target.blur();}
});
document.addEventListener("keydown",e=>{
 if(e.key==="/"&&document.activeElement!==$("search")){e.preventDefault();$("search").focus();}
 if(e.key==="Escape"){closeDrawer();$("modal-back").style.display="none";$("search-dd").classList.add("hidden");}
});
