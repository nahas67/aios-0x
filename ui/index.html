<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIOS-0X · Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Crect x='7' y='16' width='4' height='9' fill='%2300e5ff'/%3E%3Crect x='14' y='10' width='4' height='15' fill='%2300e676'/%3E%3Crect x='21' y='5' width='4' height='20' fill='%23ffc400'/%3E%3C/svg%3E">
<style>
/* ============ DESIGN SYSTEM (from Figma prototype · aios-0x-command-center) ============ */
:root{
  --bg:#000000;--panel:#080a0c;--inset:#0e1114;--inset2:#12181f;
  --line:#181c20;--line-soft:#101317;--track:#141a20;
  --text:#eceff1;--dim:#90a4ae;--faint:#455a64;
  --cyan:#00e5ff;--ok:#00e676;--warn:#ffc400;--bad:#ff1744;
  --cyan8:rgba(0,229,255,.08);--ok8:rgba(0,230,118,.08);--warn8:rgba(255,196,0,.08);--bad8:rgba(255,23,68,.08);
  --cyanA:rgba(0,229,255,.28);--okA:rgba(0,230,118,.28);--warnA:rgba(255,196,0,.28);--badA:rgba(255,23,68,.32);
  --mono:ui-monospace,"JetBrains Mono","Cascadia Mono",Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:4px;--sp:10px;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--cyan8) 1px,transparent 1px),linear-gradient(90deg,var(--cyan8) 1px,transparent 1px);background-size:36px 36px;opacity:.35;mask-image:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 65%)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:3px}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#1c242c;border-radius:4px}
::selection{background:var(--cyanA)}

/* ============ system bar ============ */
header{display:flex;align-items:center;gap:9px;height:42px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.logo{font:700 12px var(--mono);letter-spacing:.1em;color:var(--cyan)}
.ver{font:400 10px var(--mono);color:var(--faint);padding-left:9px;border-left:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:3px;font:700 10px var(--mono);background:var(--inset);border:1px solid var(--line-soft);color:var(--dim);white-space:nowrap;text-transform:uppercase}
.pill.ok{color:var(--ok);border-color:var(--okA);background:var(--ok8)}
.pill.warn{color:var(--warn);border-color:var(--warnA);background:var(--warn8)}
.pill.bad{color:var(--bad);border-color:var(--badA);background:var(--bad8)}
.pill.acc{color:var(--cyan);border-color:var(--cyanA);background:var(--cyan8)}
.spacer{flex:1}
#search{width:210px;background:var(--inset);border:1px solid var(--line-soft);color:var(--text);border-radius:3px;padding:5px 10px;font:400 11px var(--sans)}
#search::placeholder{color:var(--faint)}
.btn{background:var(--inset);border:1px solid var(--line);color:var(--dim);padding:5px 11px;border-radius:3px;font-size:11px;font-weight:600;transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.danger{color:var(--dim)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.primary{background:var(--cyan8);border-color:var(--cyanA);color:var(--cyan)}
.btn.sm{padding:4px 8px;font-size:10.5px}
select.btn{appearance:none;padding-right:20px}
label.chk{display:flex;gap:5px;align-items:center;font-size:10.5px;color:var(--dim);cursor:pointer;white-space:nowrap}
label.chk input{accent-color:var(--cyan)}

/* ============ left nav rail (48px, icon-only, Figma) ============ */
nav{position:fixed;top:42px;bottom:0;left:0;width:52px;padding:6px 0;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:2px;overflow-y:auto;overflow-x:visible;z-index:35}
nav button.rail{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:none;border:none;border-radius:4px;color:var(--faint)}
nav button.rail svg{width:18px;height:18px}
nav button.rail:hover{background:var(--inset);color:var(--dim)}
nav button.rail.active{color:var(--cyan)}
nav button.rail.active::before{content:"";position:absolute;left:-6px;top:8px;bottom:8px;width:2px;background:var(--cyan);border-radius:2px}
.rail-sep{width:22px;height:1px;background:var(--line);margin:5px 0;flex:none}
#more-pop{position:fixed;left:58px;bottom:12px;width:190px;background:var(--panel);border:1px solid var(--line);border-radius:6px;z-index:60;padding:6px;display:none;box-shadow:0 14px 34px rgba(0,0,0,.7)}
#more-pop.open{display:block}
#more-pop button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--dim);font-size:12px;padding:7px 10px;border-radius:4px}
#more-pop button:hover{background:var(--inset);color:var(--text)}
#more-pop .mp-h{font:600 9px var(--sans);color:var(--faint);text-transform:uppercase;letter-spacing:.14em;padding:5px 10px 3px}

main{margin-left:52px;padding:14px 16px 64px;max-width:1560px;position:relative}
section{display:none}section.active{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h2.sec{font:600 11px var(--sans);color:var(--dim);letter-spacing:.02em;margin:20px 0 9px}
h2.sec:first-child{margin-top:0}
h2.sec small{color:var(--faint);text-transform:none;letter-spacing:0;font-weight:400}

/* ============ command deck grid ============ */
.deck{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;min-width:0}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ptitle{font:600 11px var(--sans);color:var(--dim)}
.psub{font:400 10px var(--sans);color:var(--faint)}
.tbadge{padding:3px 8px;border-radius:3px;font:700 10px var(--mono);letter-spacing:.02em;white-space:nowrap}
.tbadge.ok{color:var(--ok);background:var(--ok8)} .tbadge.warn{color:var(--warn);background:var(--warn8)}
.tbadge.bad{color:var(--bad);background:var(--bad8)} .tbadge.acc{color:var(--cyan);background:var(--cyan8)}
.tbadge.dim{color:var(--dim);background:var(--inset)}

/* live investment state */
.microlabel{display:block;font:400 8px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.navrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#dk-nav{font:700 26px var(--mono);letter-spacing:.01em}
#dk-ret{font:700 14px var(--mono)}
.kpimicro{display:flex;gap:16px;align-items:flex-start}
.kpimicro .si{text-align:right}
.kpimicro .si .v{display:block;font:700 12px var(--mono);margin-top:1px}
.chartwrap{margin:8px 0 6px;border:1px solid var(--line-soft);border-radius:3px;background:#05070a;overflow:hidden}
.chartwrap canvas{width:100%;height:148px;display:block}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cfoot>span{font:400 10px var(--sans);color:var(--faint)}
.tpills{display:flex;gap:4px}
.tpill{font:700 9px var(--mono);color:var(--dim);background:var(--inset);border:1px solid var(--line-soft);border-radius:3px;padding:3px 8px}
.tpill.on{color:var(--text);background:var(--inset2);border-color:#232b34}

/* ai intelligence */
.thesis-card{background:var(--inset);border:1px solid var(--line-soft);border-radius:4px;padding:12px}
.thesis-title{color:var(--cyan);font:600 11px var(--mono);letter-spacing:.03em}
.thesis-body{font-size:11.5px;color:var(--text);line-height:1.55;margin-top:6px}
.arow{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:11px;color:var(--dim);border-bottom:1px dashed var(--line-soft)}
.arow:last-of-type{border-bottom:none}
.arow .st{font:700 11px var(--mono);white-space:nowrap}
.btnrow{display:flex;gap:8px;margin-top:12px}
.abtn{flex:1;padding:7px 4px;font-size:10.5px;font-weight:600;letter-spacing:.02em;border-radius:3px;border:1px solid;background:var(--inset);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abtn.ok{background:var(--ok8);color:var(--ok);border-color:var(--okA)}
.abtn.bad{background:var(--bad8);color:var(--bad);border-color:var(--badA)}
.abtn.ok:hover{background:rgba(0,230,118,.16)} .abtn.bad:hover{background:rgba(255,23,68,.16)}
.abtn:disabled{opacity:.45;cursor:not-allowed}
.abtn:hover:not(:disabled){filter:brightness(1.25)}

/* allocation */
.stackbar{display:flex;height:16px;border-radius:3px;overflow:hidden;border:1px solid var(--line-soft);margin-bottom:10px;background:#05070a}
.stackbar i{display:block;height:100%}

/* risk */
.prow{margin-bottom:9px}
.prow .pl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.prow .pl b{color:var(--text);font:400 11px var(--mono)}
.ptrack{height:3px;background:var(--track);border-radius:2px;margin-top:5px;overflow:hidden}
.ptrack i{display:block;height:100%;background:var(--cyan);border-radius:2px;transition:width .3s}
.ptrack i.ok{background:var(--ok)} .ptrack i.warn{background:var(--warn)} .ptrack i.bad{background:var(--bad)}
.haltbox{display:flex;justify-content:space-between;align-items:center;background:var(--bad8);border:1px solid var(--badA);border-radius:4px;padding:8px 10px;margin-top:11px}
.haltbox .t{font:600 11px var(--sans);color:var(--bad)}
.haltbox .v{font:700 11px var(--mono);color:var(--bad)}
.haltbox.warn{background:var(--warn8);border-color:var(--warnA)} .haltbox.warn .t,.haltbox.warn .v{color:var(--warn)}
.haltbox.ok{background:var(--ok8);border-color:var(--okA)} .haltbox.ok .t,.haltbox.ok .v{color:var(--ok)}

/* debate */
.ratio-labels{display:flex;justify-content:space-between;font:600 11px var(--mono);margin-bottom:5px}
.ratio-labels .bull{color:var(--ok)} .ratio-labels .bear{color:var(--bad)}
.ratio{height:6px;border-radius:3px;overflow:hidden;display:flex;background:var(--track)}
.ratio .bull{background:var(--ok)} .ratio .bear{background:var(--bad)}
.argrow{background:var(--inset);border:1px solid var(--line-soft);border-radius:4px;padding:8px 10px;margin-top:8px}
.argrow .at{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.argrow .who{font:600 10px var(--mono)} .argrow .who.ok{color:var(--ok)} .argrow .who.bad{color:var(--bad)}
.argrow .conv{font:400 9px var(--mono);color:var(--faint);white-space:nowrap}
.argrow .q{font-size:10.5px;color:var(--text);margin-top:3px;line-height:1.45}

/* provenance */
.cnode{background:var(--inset);border:1px solid var(--line-soft);border-radius:4px;padding:6px 10px;margin-bottom:6px;border-left:2px solid var(--cyanA)}
.cnode .nh{display:flex;justify-content:space-between;font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.cnode .nh .k{color:var(--cyan)} .cnode .nh .t{color:var(--faint);font-weight:400;letter-spacing:0}
.cnode .nb{font-size:10.5px;color:var(--text);margin-top:2px;line-height:1.4}

/* tape */
.tape{width:100%;border-collapse:collapse;font:400 10px var(--mono)}
.tape th{font:400 9px var(--sans);color:var(--faint);text-transform:uppercase;letter-spacing:.1em;text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
.tape td{padding:5px 8px;border-bottom:1px solid var(--line-soft);color:var(--text)}
.tape td.t{color:var(--dim)} .tape td.b{font-weight:700}
.st-ok{color:var(--ok);font-weight:700;font-size:9px} .st-warn{color:var(--warn);font-weight:700;font-size:9px}
.st-bad{color:var(--bad);font-weight:700;font-size:9px} .st-dim{color:var(--faint);font-weight:700;font-size:9px}

/* regimes */
.rrow{background:var(--inset);border:1px solid var(--line-soft);border-radius:4px;padding:7px 10px;margin-bottom:6px;display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center}
.rrow .sym{font:600 11px var(--mono);color:var(--text)}
.rrow .px{font-size:10.5px;color:var(--dim)}
.rrow .px b{color:var(--text);font:700 11px var(--mono)}
.rrow .rg{display:flex;gap:5px;align-items:center}
.rtag{font:700 8px var(--mono);letter-spacing:.06em;border-radius:3px;padding:2px 6px}
.rtag.ok{color:var(--ok);background:var(--ok8)} .rtag.warn{color:var(--warn);background:var(--warn8)}
.rtag.bad{color:var(--bad);background:var(--bad8)} .rtag.dim{color:var(--dim);background:var(--inset2)}

/* ============ generic components ============ */
.grid{display:grid;gap:10px}
.cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px 15px}
.card b{display:block;font:400 8.5px var(--sans);color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;font-weight:600}
.card .v{font:700 18px var(--mono)}
.card .s{font-size:10.5px;color:var(--faint);margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.warnT{color:var(--warn)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
th,td{padding:7px 12px;border-bottom:1px solid var(--line-soft);text-align:left;font-size:11.5px}
th{color:var(--faint);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;background:var(--inset)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--inset)}
tr.rowlink{cursor:pointer}
.empty{padding:16px;text-align:center;color:var(--faint);font-size:11.5px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font:600 10px var(--mono);letter-spacing:.03em}
.b-buy{background:var(--ok8);color:var(--ok)} .b-sell{background:var(--bad8);color:var(--bad)}
.b-ok{background:var(--ok8);color:var(--ok)} .b-warn{background:var(--warn8);color:var(--warn)}
.b-bad{background:var(--bad8);color:var(--bad)} .b-dim{background:var(--inset2);color:var(--dim)}
.b-acc{background:var(--cyan8);color:var(--cyan)}
.bar{height:3px;background:var(--track);border-radius:2px;overflow:hidden;margin-top:4px;min-width:70px}
.bar i{display:block;height:100%;background:var(--cyan)} .bar i.ok{background:var(--ok)} .bar i.bad{background:var(--bad)} .bar i.warn{background:var(--warn)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line-soft);font-size:12px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--dim)}
pre.raw{background:#05070a;border:1px solid var(--line-soft);border-radius:4px;padding:12px;font:400 11px var(--mono);color:#8fa3ba;white-space:pre-wrap;word-break:break-word;max-height:400px;overflow:auto}
.hidden{display:none!important}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line-soft);border-radius:999px;padding:4px 11px;font-size:11px;color:var(--dim);margin-right:6px}
.chip b{color:var(--text);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot.g{background:var(--ok);box-shadow:0 0 6px var(--ok);animation:pulse 2s infinite}
.dot.a{background:var(--warn);box-shadow:0 0 6px var(--warn)} .dot.r{background:var(--bad);box-shadow:0 0 6px var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* drawer / modal / toast */
#drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:40;display:none}
#drawer{position:fixed;top:0;right:-660px;bottom:0;width:min(660px,94vw);background:var(--panel);border-left:1px solid var(--line);z-index:41;transition:right .22s ease-out;display:flex;flex-direction:column;overscroll-behavior:contain}
#drawer.open{right:0}
#drawer .dhead{padding:15px 20px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
#drawer .dbody{padding:16px 20px 30px;overflow-y:auto;flex:1}
.x{cursor:pointer;color:var(--dim);font-size:19px;background:none;border:none;line-height:1}
.x:hover{color:var(--text)}
#modal-back{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(560px,94vw);padding:20px 22px;max-height:86vh;overflow:auto}
#toast{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:5px;padding:10px 14px;font-size:12px;color:var(--text);min-width:240px;max-width:360px;box-shadow:0 12px 30px rgba(0,0,0,.7);animation:fade .18s ease-out}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.bad{border-left-color:var(--bad)}

/* settings */
.acc{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--panel);margin-bottom:9px;overflow:hidden}
.acc>.head{padding:11px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:12.5px}
.acc>.head small{color:var(--faint);font-weight:400;margin-left:9px}
.acc>.body{padding:4px 15px 13px;border-top:1px solid var(--line-soft)}
.expert-only{display:none}.expert .expert-only{display:block}.expert tr.expert-only{display:table-row}
ul.clean{list-style:none}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.integrity-banner{font:700 10px var(--mono);color:var(--bad);background:var(--bad8);border:1px solid var(--badA);border-radius:3px;padding:4px 9px;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--faint)}
#mobile-menu{display:none}

@media(max-width:1100px){.deck>.panel{grid-column:span 12!important}#dk-nav{font-size:21px}}
@media(max-width:960px){main{padding:12px 10px 60px}header{padding:0 8px;gap:6px;height:56px;flex-wrap:wrap}nav{top:56px}.hide-mobile{display:none!important}#search{width:120px}#search-dd{width:min(90vw,320px)!important}.grid[style*="1fr 1fr"]{grid-template-columns:1fr!important}.cards{grid-template-columns:repeat(2,minmax(0,1fr))!important}.kpimicro{gap:10px}#autonomy{max-width:92px}.abtn{font-size:9.5px}}
@media(max-width:640px){#mobile-menu{display:inline-flex}nav{display:none}nav.mobile-open{display:flex;z-index:50;width:220px;box-shadow:14px 0 40px rgba(0,0,0,.8)}nav.mobile-open button.rail{width:100%;justify-content:flex-start;gap:10px;padding:0 14px}table{display:block;overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>

<header>
  <button class="btn" id="mobile-menu" aria-label="Open navigation" aria-controls="nav">☰</button>
  <span class="logo">AIOS-0X</span>
  <span class="ver hide-mobile">V0.1.0-SECURE</span>
  <span id="p-sys" class="pill ok hide-mobile"><span class="dot g"></span>ALL SYSTEMS NOMINAL</span>
  <span id="p-risk" class="pill">RISK: —</span>
  <span id="p-state" class="pill hide-mobile">STATE —</span>
  <span id="p-dd" class="pill hide-mobile">DD —</span>
  <span id="p-chain" class="pill hide-mobile">CHAIN —</span>
  <span id="p-nav" class="pill hide-mobile">NAV —</span>
  <span id="p-mode" class="pill hide-mobile">MODE —</span>
  <span id="p-sse" class="pill hide-mobile">SSE —</span>
  <div class="spacer"></div>
  <div style="position:relative">
    <input id="search" autocomplete="off" placeholder="Search  ( / )" aria-label="Global search">
    <div id="search-dd" class="hidden" style="position:absolute;top:110%;right:0;width:340px;max-height:420px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.7)"></div>
  </div>

let RANGE="ALL";
function drawChart(canvas,series,dd,bench){
 const ctx=canvas.getContext("2d");const w=canvas.width=canvas.offsetWidth*2;const h=canvas.height=canvas.offsetHeight*2;
 ctx.clearRect(0,0,w,h);
 if(!series||series.length<2){ctx.fillStyle="#455a64";ctx.font="22px Inter, sans-serif";ctx.fillText("Not enough data",w/2-90,h/2);return;}
 const n=series.length;
 const cut={ "1D":.05,"1W":.1,"1M":.2,"3M":.33,"YTD":.66 }[RANGE]??0;
 const s2=series.slice(Math.floor(n*cut)),d2=(dd||[]).slice(Math.floor(n*cut));
 const b2=(bench&&bench.length>1)?bench.slice(Math.floor(n*cut)):null;
 const m=Math.min(...s2),M=Math.max(...s2);const range=(M-m)||1;
 const pad=30;const iw=w-pad-16,ih=h-pad*1.6;const y0=h-pad*0.6;
 ctx.strokeStyle="#101317";ctx.lineWidth=1;
 for(let g=0;g<=3;g++){const y=pad+g/3*ih;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-16,y);ctx.stroke();
  ctx.fillStyle="#455a64";ctx.font="16px JetBrains Mono, monospace";ctx.fillText((M-g/3*range).toFixed(0),2,y+5);}
 const xy=i=>[pad+i/(s2.length-1)*iw, pad+(1-(s2[i]-m)/range)*ih];
 // drawdown area (between running peak and equity)
 if(d2&&d2.length===s2.length){
  let peak=-1e18;const peaks=s2.map(v=>peak=Math.max(peak,v));
  const py=v=>pad+(1-(v-m)/range)*ih;
  ctx.beginPath();ctx.moveTo(...xy(0));
  for(let i=1;i<s2.length;i++)ctx.lineTo(...xy(i));
  for(let i=s2.length-1;i>=0;i--){ctx.lineTo(pad+i/(s2.length-1)*iw,py(peaks[i]));}
  ctx.closePath();ctx.fillStyle="rgba(255,23,68,.08)";ctx.fill();
 }
 // benchmark
 if(b2&&b2.length===s2.length){
  const bmin=Math.min(...b2),bmax=Math.max(...b2),br=(bmax-bmin)||1;
  ctx.beginPath();
  for(let i=0;i<b2.length;i++){const x=pad+i/(b2.length-1)*iw;const y=pad+(1-((b2[i]-bmin)/br*(M-m)+m-m)/range)*ih;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  ctx.strokeStyle="rgba(69,90,100,.55)";ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.stroke();ctx.setLineDash([]);
 }
 // area + line
 ctx.beginPath();ctx.moveTo(...xy(0));
 for(let i=1;i<s2.length;i++)ctx.lineTo(...xy(i));
 ctx.lineTo(w-16,y0);ctx.lineTo(pad,y0);ctx.closePath();
 ctx.fillStyle="rgba(0,229,255,.05)";ctx.fill();
 ctx.beginPath();ctx.moveTo(...xy(0));
 for(let i=1;i<s2.length;i++)ctx.lineTo(...xy(i));
 ctx.strokeStyle="#00e5ff";ctx.lineWidth=2.5;ctx.stroke();
 const [lx,ly]=xy(s2.length-1);
 ctx.beginPath();ctx.arc(lx,ly,5,0,Math.PI*2);ctx.fillStyle="#00e5ff";ctx.fill();
}
function computeStats(series){
 if(!series||series.length<2)return{ret:null,vol:null,mdd:null,sharpe:null};
 const rets=[];for(let i=1;i<series.length;i++){if(series[i-1]>0)rets.push((series[i]-series[i-1])/series[i-1]);}
 const mean=rets.length?rets.reduce((a,b)=>a+b,0)/rets.length:0;
 const sd=rets.length>1?Math.sqrt(rets.reduce((a,r)=>a+(r-mean)**2,0)/(rets.length-1)):0;
 let peak=series[0],mdd=0;for(const v of series){peak=Math.max(peak,v);if(peak>0)mdd=Math.max(mdd,(peak-v)/peak*100);}
 return{ret:(series[series.length-1]/series[0]-1)*100,vol:sd*Math.sqrt(Math.max(rets.length,1))*100,
  mdd,sharpe:sd>0?mean/sd*Math.sqrt(Math.max(rets.length,1)):null};
}

 $("al-bar").innerHTML=alloc.length?alloc.map(([k,v])=>`<i style="width:${clamp(v,0,100)}%;background:${PAL[k]||PAL.OTHER}" title="${esc(k)} ${v}%"></i>`).join(""):"";
 $("al-table").innerHTML=alloc.length?`<table class="tape"><thead><tr><th>Sector</th><th>Exposure</th><th>Target</th><th>Delta</th><th>Risk Cont.</th></tr></thead><tbody>${
  alloc.map(([k,v])=>{
   const delta=cap==null?null:(v-cap);
   const riskCont=pf.exposure_pct>0?(v/pf.exposure_pct*100):0;
   return `<tr><td class="b">${esc(k)}</td><td>${v.toFixed(1)}%</td><td class="t">${cap==null?"—":cap+"%"}</td>
    <td class="${delta==null?"":cls(delta)}">${delta==null?"—":(delta>=0?"+":"")+delta.toFixed(1)}%</td>
    <td class="${cap!=null&&v>cap?"neg":""}">${riskCont.toFixed(1)}%</td></tr>`;}).join("")}</tbody></table>`
  :`<div class="empty">No open exposure.</div>`;
 // risk controls
 const g=SYNC.gov||{};
 const halt=sett?.risk?.halt_dd_pct??g.halt_dd_pct;
 const maxCls=Math.max(0,...alloc.map(([,v])=>v),0);
 const rows=[
  ["Max Drawdown Limit",dd,halt!=null?halt:null,"%"],
  ["Concentration limit",maxCls,cap,"%"],
  ["Gross Exposure",pf.exposure_pct??0,100,"%"],
  ["Halt headroom",halt!=null?Math.max(0,halt-dd):null,halt,"%"]];
 $("rk-rows").innerHTML=rows.map(([k,v,max])=>{
  const pct=(v!=null&&max)?clamp(v/max*100,0,100):0;
  const tone=pct>=85?"bad":pct>=60?"warn":"ok";
  return `<div class="prow"><div class="pl"><span>${k}</span><b>${v==null?"—":Number(v).toFixed(1)}% / ${max==null?"—":max+"%"}</b></div>
   <div class="ptrack"><i class="${tone}" style="width:${pct}%"></i></div></div>`;}).join("");
 $("rk-status").textContent=(ex.emergency_state||"—");
 $("rk-status").className="tbadge "+(ex.emergency_state==="NORMAL"?"ok":ex.emergency_state==="EMERGENCY_HALT"?"bad":"warn");
 const dist=(halt!=null&&dd!=null)?(halt-dd):null;
 const hb=$("rk-halt");
 if(dist==null){hb.innerHTML=`<span class="t">Distance to Emergency Halt:</span><span class="v">—</span>`;}
 else{
  const k=dist<1.5?"":dist<3?"warn":"ok";
  hb.className="haltbox "+(k==="ok"?"ok":k==="warn"?"warn":"");
  hb.innerHTML=`<span class="t">Distance to Emergency Halt:</span><span class="v">${Math.max(0,dist).toFixed(1)}%</span>`;
 }
 // debate
 const nodes=(ag.agents||[]).length;
 $("db-nodes").textContent=nodes?nodes+" Active Nodes":"—";
 const conf=d?.verification?.confidence_score??last?.confidence_pct??null;
 const bull=conf!=null?conf:50;
 $("db-bull").textContent=conf==null?"NEUTRAL":`BULLISH ${Math.round(bull)}%`;
 $("db-bear").textContent=conf==null?"AWAITING THESIS":`BEARISH ${Math.round(100-bull)}%`;
 $("db-ratio").style.width=bull+"%";
 const ev=d?.evidence||{};
 const sup=(ev.supporting_arguments||[])[0],cnt=(ev.counter_arguments||[])[0];
 $("db-args").innerHTML=(sup||cnt)?`
  ${sup?`<div class="argrow"><div class="at"><span class="who ok">THESIS SUPPORT [${(ev.supporting_arguments||[]).length}]</span><span class="conv">${conf!=null?conf+"% conviction":"—"}</span></div><div class="q">“${esc(String(sup)).slice(0,150)}”</div></div>`:""}
  ${cnt?`<div class="argrow"><div class="at"><span class="who bad">COUNTER-ARGUMENT [${(ev.counter_arguments||[]).length}]</span><span class="conv">risk model</span></div><div class="q">“${esc(String(cnt)).slice(0,150)}”</div></div>`:""}`
  :`<div class="argrow"><div class="at"><span class="who ok">AGENT NETWORK</span></div><div class="q">No debate recorded yet — arguments appear after the first verified decision.</div></div>`;
 // provenance chain
 if(d){
  const v=d.verification||{},o=d.outcome||{},s=d.decision||{};
  const chain=[
   ["Source",fmt(s.strategy_id||s.symbol)],
   ["Evidence",`${(ev.supporting_arguments||[]).length} supporting / ${(ev.counter_arguments||[]).length} counter`],
   ["Hypothesis",String(d.reason?.thesis||"—").slice(0,80)],
   ["Verification",`fact ${fmt(v.fact_score)}/40 · balance ${fmt(v.balance_score)}/30 · math ${fmt(v.math_score)}/30 ${d.chain_complete?"✓":"⚠"}`],
   ["Execution",`${o.actual_pnl!=null?("closed "+money(o.actual_pnl)):"open"} @ ${fmt(s.entry_price)}`]];
  $("pv-chain").innerHTML=chain.map(([k,body],i)=>`
   <div class="cnode"><div class="nh"><span class="k">${k}</span><span class="t">${i===0?"LATEST DECISION":"STEP "+(i+1)}</span></div>
   <div class="nb">${esc(body)}</div></div>`).join("");
 }else{
  $("pv-chain").innerHTML=`<div class="cnode"><div class="nb" style="color:var(--faint)">Provenance chain appears here once the first decision completes its source → evidence → hypothesis → verification → execution pipeline.</div></div>`;
 }
 // tape
 const orders=(SYNC.orders||[]);
 $("tp-rows").innerHTML=orders.length?`<table class="tape"><thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Price</th><th>Status</th></tr></thead><tbody>${
  orders.slice(0,8).map(o=>{
   const stc=s=>s==="FILLED"?"st-ok":s==="PARTIAL"?"st-warn":(s==="REJECTED")?"st-bad":"st-dim";
   return `<tr><td class="t">${esc(String(o.created_at||"").slice(11,19))}</td><td class="b">${esc(o.symbol)}</td>
    <td class="${o.side==="SELL"?"neg":"pos"}" style="font-weight:700">${esc(o.side)}</td>
    <td>${Number(o.quantity||0).toLocaleString()}</td><td>${o.avg_fill_price?money(o.avg_fill_price):"—"}</td>
    <td class="${stc(o.status)}">${esc(o.status)}</td></tr>`;}).join("")}</tbody></table>`
  :`<div class="empty">No orders yet.</div>`;
 // regimes
 const rms=(reg.regimes||[]);
 $("rg-rows").innerHTML=rms.length?rms.slice(0,6).map(r=>{
  const tr=r.trend==="UP"?"ok":r.trend==="DOWN"?"bad":"dim";
  const trl=r.trend==="UP"?"TRENDING":r.trend==="DOWN"?"BEARISH":"RANGE-BOUND";
  const vr=r.vol_regime==="HIGH"?"warn":r.vol_regime==="LOW"?"dim":"dim";
  const vrl=r.vol_regime==="HIGH"?"VOLATILE":r.vol_regime==="LOW"?"CALM":"NORMAL";
  return `<div class="rrow"><span class="sym">${esc(r.symbol)}</span>
   <span class="px">σ ${fmt(r.realized_vol_pct)}% · ${fmt(r.window_bars)} bars</span>
   <span class="rg"><span class="rtag ${tr}">${trl}</span><span class="rtag ${vr}">${vrl}</span></span></div>`;}).join("")
  :`<div class="empty">No regime data — needs ≥5 bars per symbol.</div>`;
 // bottom blocks
 $("c-decisions").innerHTML=decTable((decs.executions||[]).slice(0,8));
 const evl=(evts.events||[]).slice(0,6);
 $("c-events").innerHTML=evl.length?evl.map(e=>`<div class="kv"><span>${badge(e.label,"b-acc")} ${esc(String(e.title)).slice(0,90)}</span><span style="color:var(--faint);font-size:11px">${esc(String(e.ts)).slice(11,19)}</span></div>`).join("")
  :`<div class="empty">Quiet — no world/risk events.</div>`;
}
function decTable(rows){
 return rows.length?`<table><thead><tr><th>Symbol</th><th>Action</th><th>Verification</th><th>Confidence</th><th>Outcome</th></tr></thead><tbody>${
  rows.map(e=>`<tr class="rowlink" tabindex="0" role="button" aria-label="Open decision ${esc(e.symbol)}" onclick="openDecision('${e.execution_id}')" onkeydown="if(event.key==='Enter')openDecision('${e.execution_id}')">
   <td><b>${esc(e.symbol)}</b></td>
   <td>${badge(e.action||"?",e.action==="SELL"?"b-sell":"b-buy")}</td>
   <td>${badge("VERIFIED ✓","b-ok")}</td>
   <td><div style="min-width:84px">${e.confidence_pct!=null?e.confidence_pct+"%":"100%"}<div class="bar"><i class="${(e.confidence_pct||100)>=70?"ok":"warn"}" style="width:${e.confidence_pct||100}%"></i></div></div></td>
   <td class="${cls(e.realized_pnl)}">${money(e.realized_pnl)}<br><small style="color:var(--faint)">${fmt(e.exit_reason)}</small></td></tr>`).join("")}</tbody></table>`
  :`<div class="empty">No closed decisions yet.</div>`;
}
function paintHeader(ex){
 const st=ex.emergency_state||"UNKNOWN";
 pill("p-risk","RISK: "+st,st==="NORMAL"?"ok":(st==="EMERGENCY_HALT"||st==="HALT")?"bad":"warn");
 pill("p-state","STATE "+st,st==="NORMAL"?"ok":"bad");
 const degraded=!ex.chain_valid||["EMERGENCY_HALT","HALT","LOCKED_OUT"].includes(st);
 pill("p-sys",(degraded?'<span class="dot r"></span>SYSTEM DEGRADED':'<span class="dot g"></span>ALL SYSTEMS NOMINAL'),degraded?"bad":"ok");
 pill("p-dd",`DD ${ex.drawdown_pct??0}%`,(ex.drawdown_pct??0)>=2.5?"bad":(ex.drawdown_pct??0)>=1.5?"warn":"ok");
 pill("p-chain","CHAIN "+(ex.chain_valid?"OK":"BROKEN"),ex.chain_valid?"ok":"bad");
 const integrity=$("integrity-banner");
 if(integrity){integrity.textContent=ex.chain_valid?"Integrity verified":"Action required · audit chain broken";integrity.className="integrity-banner "+(ex.chain_valid?"":"bad");}
}

   <div><h2 class="sec">Counterarguments !</h2><ul class="clean">${(ev.counter_arguments||[]).map(x=>`<li style="padding:3px 0;color:var(--bad)">! ${esc(x)}</li>`).join("")||'<li style="color:var(--faint)">none</li>'}</ul></div>

   <div class="kv"><span class="k">${k}</span><span style="min-width:180px">${fmt(val)} / ${max}<div class="bar"><i style="width:${(val??0)/max*100}%"></i></div></span></div>`).join("")}
  ${(v.flagged_hallucinations||[]).length?`<div><h2 class="sec">Flagged</h2>${v.flagged_hallucinations.map(h=>badge(h.slice(0,60),"b-bad")).join("<br>")}</div>`:""}
  <h2 class="sec">Risk Geometry</h2>

  <div class="kv"><span class="k">Size</span><span>${fmt(s.position_size_pct)}%</span></div>
  <h2 class="sec">Lessons</h2>

  <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
   <button class="btn" onclick="dToggle('raw-a')">Agent Trace</button>
   <button class="btn" onclick="dToggle('raw-j')">Raw JSON</button>
   <button class="btn" onclick="dToggle('raw-aud')">Audit Trail</button>

 openDrawer(s.symbol+" decision");

<h2 class="sec">Performance Analytics</h2>
<div class="grid cards" id="an-cards"></div>
<div class="panel" style="padding:10px"><canvas id="an-chart" aria-label="Equity curve analytics" style="width:100%;height:260px;display:block"></canvas></div>

 <div class="panel" style="grid-column:span 5"><div class="phead"><span class="ptitle">Allocation Mix</span></div><canvas id="an-donut" style="width:100%;height:210px;display:block" aria-label="Allocation donut"></canvas></div>
 <div class="panel" style="grid-column:span 3"><div class="phead"><span class="ptitle">Return Distribution</span><span class="psub">per-step returns</span></div><canvas id="an-hist" style="width:100%;height:210px;display:block" aria-label="Return histogram"></canvas></div>

function drawDonut(canvas,entries){
 const ctx=canvas.getContext("2d");const w=canvas.width=canvas.offsetWidth*2;const h=canvas.height=canvas.offsetHeight*2;
 ctx.clearRect(0,0,w,h);
 const total=entries.reduce((a,[,v])=>a+v,0);
 if(!entries.length||total<=0){ctx.fillStyle="#455a64";ctx.font="20px Inter";ctx.fillText("No exposure",w/2-60,h/2);return;}
 const cx=w*0.36,cy=h/2,R=Math.min(w,h)*0.36,r=R*0.62;
 const PAL={EQUITY:"#00e5ff",CRYPTO:"#0288d1",ETF:"#00acc1",COMMODITY:"#d81b60",FIXED_INCOME:"#5e35b1",CASH:"#455a64",OTHER:"#78909c"};
 let a0=-Math.PI/2;
 for(const [k,v] of entries){
  const a1=a0+v/total*Math.PI*2;
  ctx.beginPath();ctx.arc(cx,cy,R,a0,a1);ctx.arc(cx,cy,r,a1,a0,true);ctx.closePath();
  ctx.fillStyle=PAL[k]||PAL.OTHER;ctx.fill();a0=a1;
 }
 ctx.fillStyle="#eceff1";ctx.font="700 22px JetBrains Mono, monospace";ctx.textAlign="center";
 ctx.fillText(entries.length+"",cx,cy+6);ctx.font="400 13px Inter";ctx.fillText("classes",cx,cy+26);
 ctx.textAlign="left";
 let ly=cy-entries.length*13+13;
 for(const [k,v] of entries){ctx.fillStyle=PAL[k]||PAL.OTHER;ctx.fillRect(w*0.62,ly-9,12,12);
  ctx.fillStyle="#90a4ae";ctx.font="400 15px Inter";ctx.fillText(`${k} — ${v}%`,w*0.62+20,ly+2);ly+=26;}
}
function drawHist(canvas,series){
 const ctx=canvas.getContext("2d");const w=canvas.width=canvas.offsetWidth*2;const h=canvas.height=canvas.offsetHeight*2;
 ctx.clearRect(0,0,w,h);
 const rets=[];for(let i=1;i<(series||[]).length;i++){if(series[i-1]>0)rets.push((series[i]-series[i-1])/series[i-1]*100);}
 if(rets.length<2){ctx.fillStyle="#455a64";ctx.font="20px Inter";ctx.fillText("Not enough data",w/2-70,h/2);return;}
 const B=18,bins=new Array(B).fill(0);
 const lo=Math.min(...rets),hi=Math.max(...rets);const span=(hi-lo)||1;
 rets.forEach(r=>bins[clamp(Math.floor((r-lo)/span*B),0,B-1)]++);
 const bw=w/B;const mx=Math.max(...bins);
 for(let i=0;i<B;i++){
  const bh=mx?bins[i]/mx*(h-40):0;
  const mid=(i+0.5)/B;
  ctx.fillStyle=mid<0.5?"rgba(255,23,68,.55)":"rgba(0,230,118,.55)";
  ctx.fillRect(i*bw+3,h-24-bh,bw-6,bh);
 }
 ctx.strokeStyle="#101317";ctx.beginPath();ctx.moveTo(0,h-24);ctx.lineTo(w,h-24);ctx.stroke();
 ctx.fillStyle="#455a64";ctx.font="14px JetBrains Mono, monospace";
 ctx.fillText(lo.toFixed(2)+"%",4,h-6);ctx.fillText("+",w/2-3,h-6);ctx.fillText(hi.toFixed(2)+"%",w-52,h-6);
}

SECTIONS.settings=`<h2 class="sec">Settings Center</h2>
 <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
  <input id="set-q" class="btn" style="width:260px" placeholder="Filter settings…" oninput="filterSettings(this.value)" aria-label="Search settings">
  <span class="psub">Presets:</span>
  <button class="btn sm" onclick="applyPreset('CONSERVATIVE')">Conservative</button>
  <button class="btn sm" onclick="applyPreset('BALANCED')">Balanced</button>
  <button class="btn sm" onclick="applyPreset('AGGRESSIVE')">Aggressive</button>
  <div class="spacer"></div>
  <label class="chk"><input type="checkbox" id="expert2" onchange="document.body.classList.toggle('expert',this.checked);loadSettings()"> Expert</label>
 </div>
 <div id="s-root"></div>`;
const PRESETS={
 CONSERVATIVE:{max_class_exposure_pct:20,halt_dd_pct:2.0,research_mode:"deterministic",
  warn:"Tightest capital protection; LLM research disabled (deterministic mode)."},
 BALANCED:{max_class_exposure_pct:35,halt_dd_pct:3.0,research_mode:"auto",
  warn:"Matches ratified CONSTITUTION v1.0.0 defaults."},
 AGGRESSIVE:{max_class_exposure_pct:50,halt_dd_pct:4.0,research_mode:"auto",
  warn:"Widens permitted loss bounds beyond ratified constitution defaults — requires explicit risk acceptance."},
};
async function loadSettings(){const d=await j("/api/v1/settings");
 SYNC.settings=d;
 const groups=[
  ["SYSTEM","system",[["Model provider","model_provider"],["Research mode","research_mode","research"],["LLM configured","llm_configured_bool"],["Shadow mode","shadow_bool"]]],
  ["AI & AGENTS","ai",[["Cheap model","research_model_cheap"],["Reasoning model","research_model_reasoning"],["Verifier","verification_model"],["Temperature","llm_temperature"]]],
  ["DATA PROVIDERS","data",[["Finnhub","finnhub_bool"],["GNews","gnews_bool"],["NewsData","newsdata_bool"],["MarketStack","marketstack_bool"],["FRED","fred_bool"]]],
  ["RISK LIMITS","risk",[["Max class exposure %","max_class_exposure_pct","limit"],["Halt drawdown %","halt_dd_pct","limit"],["Caution drawdown %","caution_dd_pct"],["Warning drawdown %","warning_dd_pct"]]],
  ["EXECUTION RAILS","execution_rails",[["Live execution (env)","live_execution_allowed_env_bool"],["Micro-live cap $","micro_live_cap_usd"],["Constitution pinned","constitution_pinned_bool"]]],
 ];
 const bools=new Set(["llm_configured_bool","shadow_bool","finnhub_bool","gnews_bool","newsdata_bool","marketstack_bool","fred_bool","live_execution_allowed_env_bool","constitution_pinned_bool"]);
 $("s-root").innerHTML=groups.map(([title,key,rows])=>`
  <div class="acc" data-group="${key}"><div class="head" onclick="this.nextElementSibling.classList.toggle('hidden')">${title}<small>effective values</small></div><div class="body">
  ${rows.map(([label,k,edit])=>{
    let v=d[key]?.[k];
    let control="";
    if(edit==="research")control=`<select class="btn" onchange="setResearch(this.value)"><option value="auto"${v==="auto"?" selected":""}>auto</option><option value="deterministic"${v==="deterministic"?" selected":""}>deterministic</option></select>`;
    else if(edit==="limit")control=`<input class="btn" style="width:110px" value="${fmt(v)}" data-k="${k}" onchange="confirmLimit(this.dataset.k,this.value)">`;
    if(bools.has(k))v=typeof v==="boolean"&&v||v==="1"?badge("CONFIGURED","b-ok"):badge("OFF","b-dim");
    return `<div class="kv setrow" data-label="${label.toLowerCase()}"><span class="k">${label}</span><span>${control||fmt(v)}</span></div>`;
  }).join("")}
  </div></div>`).join("")
  +`<div class="acc"><div class="head" onclick="this.nextElementSibling.classList.toggle('hidden')">RAW CONFIGURATION<small>/api/v1/settings</small></div><div class="body hidden"><pre class="raw">${esc(JSON.stringify(d,null,2))}</pre></div></div>`;
}
function filterSettings(q){
 q=(q||"").toLowerCase();
 document.querySelectorAll("#s-root .setrow").forEach(row=>{
  row.style.display=row.dataset.label.includes(q)?"":"none";});
}
async function setResearch(m){await controlAct("set_research_mode",{mode:m},"Research mode set to "+m);}
async function confirmLimit(k,v){
 const current=(SYNC.settings?.risk?.[k])??null;
 const nv=Number(v);
 if(isNaN(nv)||nv<=0){toast("Value must be a positive number","bad");loadSettings();return;}
 if(current!=null&&Math.abs(nv-current)<1e-9)return;
 const labels={max_class_exposure_pct:"Max class exposure",halt_dd_pct:"Halt drawdown"};
 const riskNote=k==="halt_dd_pct"&&nv>3
  ?`<p style="color:var(--bad);font-size:12.5px;margin:8px 0">⚠ This increases permitted portfolio loss beyond the ratified constitution default (3%).</p>`:"";
 $("modal").innerHTML=`<h3 style="margin-bottom:12px">Confirm configuration change</h3>
  <div class="kv"><span class="k">Setting</span><span>${labels[k]||k}</span></div>
  <div class="kv"><span class="k">Before</span><span>${fmt(current)}${k==="halt_dd_pct"||k==="max_class_exposure_pct"?"%":""}</span></div>
  <div class="kv"><span class="k">After</span><span class="warnT">${nv}${k==="halt_dd_pct"||k==="max_class_exposure_pct"?"%":""}</span></div>
  ${riskNote}
  <div class="kv"><span class="k">Audit</span><span style="color:var(--faint)">CONTROL_ACTION recorded (operator: console, RISK_ADMIN)</span></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
   <button class="btn" onclick="closeModal();loadSettings()">Cancel</button>
   <button class="btn primary" id="confirm-limit">Confirm change</button></div>`;
 $("modal-back").style.display="flex";
 $("confirm-limit").onclick=async()=>{
  const map={max_class_exposure_pct:"set_max_position_pct",halt_dd_pct:"set_halt_drawdown_pct"};
  const action=map[k];if(!action){closeModal();return;}
  await controlAct(action,{pct:nv},"Limit updated & audited");
  loadSettings();
 };
}
function applyPreset(name){
 const preset=PRESETS[name];if(!preset)return;
 const risk=SYNC.settings?.risk||{};
 const curMode=SYNC.settings?.system?.research_mode;
 const changes=[];
 const push=(label,before,after,action,params)=>{
  if(before==null||String(before)!==String(after))changes.push({label,before,after,action,params});};
 push("Max class exposure",risk.max_class_exposure_pct,preset.max_class_exposure_pct,
  "set_max_position_pct",{pct:preset.max_class_exposure_pct});
 push("Halt drawdown",risk.halt_dd_pct,preset.halt_dd_pct,
  "set_halt_drawdown_pct",{pct:preset.halt_dd_pct});
 push("Research mode",curMode,preset.research_mode,
  "set_research_mode",{mode:preset.research_mode});
 if(!changes.length){toast(`Preset ${name} matches current configuration — nothing to change.`);return;}
 $("modal").innerHTML=`<h3 style="margin-bottom:4px">Apply preset: ${name}</h3>
  <p style="color:var(--dim);font-size:12.5px;margin-bottom:10px">${esc(preset.warn)}</p>
  <table style="margin-bottom:12px"><thead><tr><th>Setting</th><th>Before</th><th>After</th></tr></thead><tbody>
  ${changes.map(c=>`<tr><td>${c.label}</td><td style="color:var(--dim)">${fmt(c.before)}</td><td class="warnT">${fmt(c.after)}</td></tr>`).join("")}
  </tbody></table>
  <p class="psub" style="margin-bottom:12px">All changes are recorded as audited CONTROL_ACTION events (operator: console, RISK_ADMIN).</p>
  <div style="display:flex;gap:8px;justify-content:flex-end">
   <button class="btn" onclick="closeModal()">Cancel</button>
   <button class="btn primary" id="confirm-preset">Apply ${changes.length} change${changes.length>1?"s":""}</button></div>`;
 $("modal-back").style.display="flex";
 $("confirm-preset").onclick=async()=>{
  closeModal();
  for(const c of changes){await controlAct(c.action,c.params,"Preset applied: "+c.label);}
  loadSettings();
 };
}

$("search").addEventListener("input",async e=>{

 const dd=$("search-dd");
 if(!q){dd.classList.add("hidden");return;}
 const ws=[];
 [...RAIL.map(r=>[r[0],r[2]]),...MORE].forEach(([t,label])=>{if(label.toLowerCase().includes(q))ws.push({label,tab:t});});
 const sets=[];
 Object.entries(SYNC.settings||{}).forEach(([group,rows])=>{
  if(typeof rows!=="object"||!rows)return;

   if(k.toLowerCase().includes(q))sets.push({label:`${group}.${k}`,go:()=>showTab("settings")});
  });});
 let audit=[];
 try{const d=await j(`/api/v1/audit?limit=6&q=${encodeURIComponent(q)}`);
  audit=(d.audit||[]).map(a=>({label:`${a.kind} ${a.ref_id||""}`.trim().slice(0,60),go:()=>showTab("audit")}));}catch(err){}
 const render=(title,items)=>items.length?`<div style="padding:4px 0"><div style="font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;padding:4px 12px">${title}</div>${
  items.slice(0,5).map(x=>`<div style="padding:6px 12px;cursor:pointer;font-size:12px" onmouseover="this.style.background='var(--inset)'" onmouseout="this.style.background=''" onclick="$('search-dd').classList.add('hidden');(${x.go.toString()})()">${esc(x.label)}</div>`).join("")}</div>`:"";
 dd.innerHTML=render("Workspaces",ws)+render("Settings",sets)+render("Audit Records",audit)
  +`<div style="padding:8px 12px;border-top:1px solid var(--line-soft)"><button class="btn sm" onclick="$('search-dd').classList.add('hidden');showTab('audit');$('aud-q').value='${esc(q)}';loadAudit()">Full audit search →</button></div>`;
 dd.classList.remove("hidden");
});
$("search").addEventListener("keydown",e=>{
 if(e.key==="Enter"){const dd=$("search-dd");dd.classList.add("hidden");showTab("audit");$("aud-q").value=e.target.value;loadAudit();}
 if(e.key==="Escape"){$("search-dd").classList.add("hidden");e.target.blur();}
});
document.addEventListener("keydown",e=>{
 if(e.key==="/"&&document.activeElement!==$("search")){e.preventDefault();$("search").focus();}
 if(e.key==="Escape"){closeDrawer();closeModal();$("search-dd").classList.add("hidden");}
});
