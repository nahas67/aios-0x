<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Theme bootstrap, before anything can paint (ADR-008).

      Inlined deliberately and duplicated from `lib/theme.ts`'s THEME_BOOTSTRAP, because it
      must run ahead of the stylesheet: React mounts after the CSS is parsed, so a theme
      restored from storage any later flashes the default palette first — the single most
      visible way a theme system can look broken. That rules out importing it.

      `theme.test.ts` asserts this exact snippet appears in this file, so the two copies
      cannot drift. If you change one, change the other or the test will fail.
    -->
    <script>
      (function(){try{var t=localStorage.getItem('aios.theme');document.documentElement.dataset.theme=(t==='paper')?'paper':'dark-oled';}catch(e){document.documentElement.dataset.theme='dark-oled';}})();
    </script>
    <title>AIOS-0X — Autonomous Investment Command Center</title>
    <meta name="description" content="AI-native institutional investment operating system combining real-time capital trajectory, multi-agent debate, deterministic risk firewalls, and decision provenance." />
    <meta property="og:title" content="AIOS-0X — Autonomous Investment Command Center" />
    <meta property="og:description" content="AI-native institutional investment operating system combining real-time capital trajectory, multi-agent debate, deterministic risk firewalls, and decision provenance." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#08090d] text-[#e2e8f0] antialiased selection:bg-cyan-500/20 selection:text-cyan-200 overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
