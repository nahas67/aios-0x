[project]
name = "aios"
version = "0.1.0"
description = "AIOS-0X: AI-native investment institution - multi-community intelligence, verification, risk-governed execution."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aios", "core", "kernel", "schemas", "communities", "simulation", "research", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", ".venv", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter where feasible; docs strings exempt
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "ccxt.*"
ignore_missing_imports = true
